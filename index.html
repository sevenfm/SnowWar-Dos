<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow War Game Player</title>
    <!-- Load js-dos CSS and JavaScript styles -->
    <link href="https://js-dos.com/v7/build/js-dos.css" rel="stylesheet">
    <script src="https://js-dos.com/v7/build/js-dos.js"></script>
    <style>
        /* Make the game window fill the screen or container */
        #dosbox {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            background: black;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Playing Snow War</h2>
    
    <!-- The container where the game will render -->
    <div id="dosbox"></div>

    <script>
        Dos(document.getElementById("dosbox")).run("SnowWar.jsdos");
    </script>

</body>
</html>
