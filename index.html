<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow War Game Player</title>
    <!-- Load js-dos CSS and JavaScript styles -->
    <link href="https://v8.js-dos.com/latest/js-dos.css" rel="stylesheet">
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <style>
        /* Make the game window fill the screen or container */
        #dosbox {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            background: black;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Playing Snow War</h2>
    
    <!-- The container where the game will render -->
    <div id="dosbox"></div>

    <script>
    // Point directly to your bundle using the v8 configuration object
    Dos(document.getElementById("dosbox"))
        .run({
            url: "SnowWar.jsdos", // Or "SnowWar.zip" if you change it back
            exec: "SNOW.EXE",     // CHANGE THIS to your game's exact .exe, .com, or .bat file
        });
    </script>

</body>
</html>
